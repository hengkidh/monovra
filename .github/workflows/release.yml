# Builds a signed release APK (sideloading) and AAB (Google Play upload) and
# attaches both to a GitHub Release.
#
# Trigger: push a tag like v0.1.0
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   MONOVRA_KEYSTORE_BASE64   base64 of the release .jks keystore
#   MONOVRA_KEYSTORE_PASSWORD
#   MONOVRA_KEY_ALIAS
#   MONOVRA_KEY_PASSWORD
# The workflow FAILS if any of them is missing. A GitHub runner generates a new
# debug key on every run, so a debug-signed release could never be updated
# in place; refusing to publish is safer. (Local builds without a keystore
# still fall back to the debug key, see README §6.)
name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            NAME="$INPUT_VERSION"
          else
            NAME="${GITHUB_REF_NAME#v}"
          fi
          # Plain semantic version only, e.g. 0.1.0 or 1.2.0-beta.1 (no leading "v").
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$NAME'. Use a tag like v0.1.0 (or input 0.1.0 without the v)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          # Monotonic version code from the run number.
          echo "code=$(( 100 + RUN_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Require release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MONOVRA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MONOVRA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MONOVRA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MONOVRA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]      || missing="$missing MONOVRA_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing MONOVRA_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing MONOVRA_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing MONOVRA_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions (README §7). Refusing to publish a debug-signed release."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.MONOVRA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::MONOVRA_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          echo "MONOVRA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        env:
          MONOVRA_KEYSTORE_PASSWORD: ${{ secrets.MONOVRA_KEYSTORE_PASSWORD }}
          MONOVRA_KEY_ALIAS: ${{ secrets.MONOVRA_KEY_ALIAS }}
          MONOVRA_KEY_PASSWORD: ${{ secrets.MONOVRA_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Prepare artifact
        id: apk
        run: |
          OUT="monovra-${{ steps.version.outputs.tag }}.apk"
          AAB="monovra-${{ steps.version.outputs.tag }}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          sha256sum "$OUT" > "$OUT.sha256"
          sha256sum "$AAB" > "$AAB.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
              "${{ steps.apk.outputs.aab }}" "${{ steps.apk.outputs.aab }}.sha256" --clobber
          else
            gh release create "$TAG" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
              "${{ steps.apk.outputs.aab }}" "${{ steps.apk.outputs.aab }}.sha256" \
              --title "MONOVRA $TAG" --generate-notes --target "${{ github.sha }}"
          fi
